[project]
name = "ch08-finetuning"
version = "0.1.0"
description = "Chapter 8: LoRA fine-tuning of VLAs (from scratch + OpenVLA)"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "torchvision>=0.16",
    "matplotlib>=3.7",
    "transformers>=4.36",
    "pillow>=10.0",
    "pytest>=7.0",
]

# Optional extras for the real OpenVLA-7B reference path (lora_openvla.py).
# Install with: uv sync --extra openvla
[project.optional-dependencies]
openvla = [
    "peft>=0.10",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
]
