<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img">
  <style>
  .bg     { fill: #fcfcfd; }
  .ink    { fill: #1b2430; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .muted  { fill: #66727f; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono   { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  .title  { font-size: 17px; font-weight: 600; }
  .sub    { font-size: 12px; }
  .lbl    { font-size: 13px; font-weight: 600; }
  .small  { font-size: 11px; }
  .tiny   { font-size: 10px; }
  .frozen    { fill: #e7edf6; stroke: #9cb1cd; stroke-width: 1.4; stroke-dasharray: 5 3; }
  .trainable { fill: #ffefd9; stroke: #df8f38; stroke-width: 1.6; }
  .data      { fill: #f1f3f6; stroke: #c2c9d3; stroke-width: 1.3; }
  .plain     { fill: none; stroke: #c2c9d3; stroke-width: 1.3; }
  .wire   { stroke: #7d8896; stroke-width: 1.5; fill: none; }
  .wire-a { stroke: #df8f38; stroke-width: 1.8; fill: none; }
  .wire-d { stroke: #7d8896; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
</style>
  <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8896"/>
  </marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#df8f38"/>
  </marker>
</defs>
  <rect class="bg" width="820" height="330"/>
  <text class="ink title" x="24" y="30" text-anchor="start">Anatomy of a VLA</text>
  <text class="muted sub" x="24" y="49" text-anchor="start">Three inputs, one output. Every chapter changes one box.</text>
  <rect class="data" x="40" y="90" width="150" height="44" rx="7"/>
  <text class="ink lbl" x="115.0" y="108.0" text-anchor="middle">Image</text>
  <text class="muted small" x="115.0" y="124.0" text-anchor="middle">camera frame</text>
  <rect class="data" x="40" y="150" width="150" height="44" rx="7"/>
  <text class="ink lbl" x="115.0" y="168.0" text-anchor="middle">Language</text>
  <text class="muted small" x="115.0" y="184.0" text-anchor="middle">"push block to goal"</text>
  <rect class="data" x="40" y="210" width="150" height="44" rx="7"/>
  <text class="ink lbl" x="115.0" y="228.0" text-anchor="middle">State</text>
  <text class="muted small" x="115.0" y="244.0" text-anchor="middle">joint positions</text>
  <rect class="frozen" x="260" y="90" width="150" height="44" rx="7"/>
  <text class="ink lbl" x="335.0" y="108.0" text-anchor="middle">Vision encoder</text>
  <text class="muted small" x="335.0" y="124.0" text-anchor="middle">SigLIP</text>
  <rect class="frozen" x="260" y="150" width="150" height="44" rx="7"/>
  <text class="ink lbl" x="335.0" y="168.0" text-anchor="middle">Language model</text>
  <text class="muted small" x="335.0" y="184.0" text-anchor="middle">SmolLM2</text>
  <rect class="trainable" x="260" y="210" width="150" height="44" rx="7"/>
  <text class="ink lbl" x="335.0" y="228.0" text-anchor="middle">State projector</text>
  <text class="muted small" x="335.0" y="244.0" text-anchor="middle">Linear</text>
  <rect class="trainable" x="480" y="120" width="150" height="94" rx="7"/>
  <text class="ink lbl" x="555.0" y="163.0" text-anchor="middle">Action expert</text>
  <text class="muted small" x="555.0" y="179.0" text-anchor="middle">flow matching</text>
  <rect class="data" x="690" y="130" width="96" height="74" rx="7"/>
  <text class="ink lbl" x="738.0" y="163.0" text-anchor="middle">Action chunk</text>
  <text class="muted small" x="738.0" y="179.0" text-anchor="middle">K x DOF</text>
  <path class="wire" d="M 190 112 L 258 112" marker-end="url(#a)"/>
  <path class="wire" d="M 190 172 L 258 172" marker-end="url(#a)"/>
  <path class="wire" d="M 190 232 L 258 232" marker-end="url(#a)"/>
  <path class="wire" d="M 410 112 L 448 112 L 448 158"/>
  <path class="wire" d="M 448 158 L 478 158" marker-end="url(#a)"/>
  <path class="wire" d="M 410 172 L 478 170" marker-end="url(#a)"/>
  <path class="wire" d="M 410 232 L 448 232 L 448 184"/>
  <path class="wire" d="M 448 184 L 478 184" marker-end="url(#a)"/>
  <path class="wire-a" d="M 630 167 L 688 167" marker-end="url(#aa)"/>
  <text class="muted small" x="690" y="226" text-anchor="start">10 steps, executed</text>
  <text class="muted small" x="690" y="240" text-anchor="start">one per control tick</text>
  <rect class="frozen" x="40" y="279" width="16" height="12" rx="3"/>
  <text class="muted small" x="64" y="289" text-anchor="start">frozen (pretrained)</text>
  <rect class="trainable" x="40" y="299" width="16" height="12" rx="3"/>
  <text class="muted small" x="64" y="309" text-anchor="start">trainable</text>
</svg>
