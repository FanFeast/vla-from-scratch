<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452" role="img">
  <style>
  .bg     { fill: #fcfcfd; }
  .ink    { fill: #1b2430; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .muted  { fill: #66727f; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono   { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  .title  { font-size: 17px; font-weight: 600; }
  .sub    { font-size: 12px; }
  .lbl    { font-size: 13px; font-weight: 600; }
  .small  { font-size: 11px; }
  .tiny   { font-size: 10px; }
  .frozen    { fill: #e7edf6; stroke: #9cb1cd; stroke-width: 1.4; stroke-dasharray: 5 3; }
  .trainable { fill: #ffefd9; stroke: #df8f38; stroke-width: 1.6; }
  .data      { fill: #f1f3f6; stroke: #c2c9d3; stroke-width: 1.3; }
  .plain     { fill: none; stroke: #c2c9d3; stroke-width: 1.3; }
  .wire   { stroke: #7d8896; stroke-width: 1.5; fill: none; }
  .wire-a { stroke: #df8f38; stroke-width: 1.8; fill: none; }
  .wire-d { stroke: #7d8896; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
</style>
  <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
