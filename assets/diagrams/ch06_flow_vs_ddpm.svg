  <text class="muted small" x="136" y="169" text-anchor="start">velocity changes along</text>
  <text class="muted small" x="136" y="184" text-anchor="start">the path, so coarse steps</text>
  <text class="muted small" x="136" y="199" text-anchor="start">accumulate error</text>
