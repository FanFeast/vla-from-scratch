<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img">
  <style>
  .bg     { fill: #fcfcfd; }
  .ink    { fill: #1b2430; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .muted  { fill: #66727f; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono   { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  .title  { font-size: 17px; font-weight: 600; }
  .sub    { font-size: 12px; }
  .lbl    { font-size: 13px; font-weight: 600; }
  .small  { font-size: 11px; }
  .tiny   { font-size: 10px; }
  .frozen    { fill: #e7edf6; stroke: #9cb1cd; stroke-width: 1.4; stroke-dasharray: 5 3; }
  .trainable { fill: #ffefd9; stroke: #df8f38; stroke-width: 1.6; }
  .data      { fill: #f1f3f6; stroke: #c2c9d3; stroke-width: 1.3; }
  .plain     { fill: none; stroke: #c2c9d3; stroke-width: 1.3; }
  .wire   { stroke: #7d8896; stroke-width: 1.5; fill: none; }
  .wire-a { stroke: #df8f38; stroke-width: 1.8; fill: none; }
  .wire-d { stroke: #7d8896; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
</style>
  <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8896"/>
  </marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#df8f38"/>
  </marker>
</defs>
  <rect class="bg" width="880" height="340"/>
  <text class="ink title" x="24" y="30" text-anchor="start">Two ways to fuse vision and language</text>
  <text class="muted sub" x="24" y="49" text-anchor="start">Ch 3 - concat pools language to one vector; cross-attention keeps every token.</text>
  <text class="ink lbl" x="40" y="88" text-anchor="start">Concat fusion</text>
  <rect class="frozen" x="40" y="100" width="130" height="40" rx="7"/>
  <text class="ink lbl" x="105.0" y="116.0" text-anchor="middle">Vision</text>
  <text class="muted small" x="105.0" y="132.0" text-anchor="middle">1 pooled vec</text>
  <rect class="frozen" x="40" y="156" width="130" height="40" rx="7"/>
  <text class="ink lbl" x="105.0" y="172.0" text-anchor="middle">Language</text>
  <text class="muted small" x="105.0" y="188.0" text-anchor="middle">1 pooled vec</text>
  <rect class="trainable" x="215" y="122" width="96" height="52" rx="7"/>
  <text class="ink lbl" x="263.0" y="152.0" text-anchor="middle">concat</text>
  <rect class="trainable" x="340" y="130" width="78" height="36" rx="7"/>
  <text class="ink lbl" x="379.0" y="152.0" text-anchor="middle">MLP</text>
  <path class="wire" d="M 170 120 L 213 138" marker-end="url(#a)"/>
  <path class="wire" d="M 170 176 L 213 158" marker-end="url(#a)"/>
  <path class="wire" d="M 311 148 L 338 148" marker-end="url(#a)"/>
  <text class="muted small" x="40" y="232" text-anchor="start">Cheap. Language collapses to one vector, so</text>
  <text class="muted small" x="40" y="247" text-anchor="start">the policy cannot ask which word applies to</text>
  <text class="muted small" x="40" y="262" text-anchor="start">which part of the image.</text>
  <path class="wire-d" d="M 470 80 L 470 288"/>
  <text class="ink lbl" x="520" y="88" text-anchor="start">Cross-attention fusion</text>
  <rect class="frozen" x="520" y="100" width="140" height="40" rx="7"/>
  <text class="ink lbl" x="590.0" y="116.0" text-anchor="middle">Vision tokens</text>
  <text class="muted small" x="590.0" y="132.0" text-anchor="middle">queries</text>
  <rect class="frozen" x="520" y="156" width="140" height="40" rx="7"/>
  <text class="ink lbl" x="590.0" y="172.0" text-anchor="middle">Language tokens</text>
  <text class="muted small" x="590.0" y="188.0" text-anchor="middle">keys, values</text>
  <rect class="trainable" x="700" y="118" width="130" height="60" rx="7"/>
  <text class="ink lbl" x="765.0" y="144.0" text-anchor="middle">attention</text>
  <text class="muted small" x="765.0" y="160.0" text-anchor="middle">per-token</text>
  <path class="wire" d="M 660 120 L 698 138" marker-end="url(#a)"/>
  <path class="wire" d="M 660 176 L 698 158" marker-end="url(#a)"/>
  <text class="muted small" x="520" y="232" text-anchor="start">Each vision token reads individual words.</text>
  <text class="muted small" x="520" y="247" text-anchor="start">Pays off when a scene holds many objects;</text>
  <text class="muted small" x="520" y="262" text-anchor="start">on MiniPushT it costs 40x for less.</text>
  <text class="ink small" x="40" y="312" text-anchor="start">Ch 3 result, 10K demos:</text>
  <text class="muted small" x="40" y="328" text-anchor="start">concat  89.1% success / 40.0% paraphrase</text>
  <text class="muted small" x="340" y="328" text-anchor="start">cross-attn  81.8% / 38.2%</text>
</svg>
